name: Setup RDP with Ngrok

on:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Ngrok
        shell: powershell
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssword!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword

      - name: Start Ngrok Tunnel
        shell: powershell
        run: |
          # Start ngrok in background, capture output to see errors
          $outputFile = "$env:TEMP\ngrok_out.txt"
          $errorFile = "$env:TEMP\ngrok_err.txt"
          
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -WindowStyle Hidden -RedirectStandardOutput $outputFile -RedirectStandardError $errorFile
          
          # Wait for ngrok to start
          Start-Sleep -Seconds 15
          
          # Check if ngrok process is running
          $ngrokProcess = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
          if (-not $ngrokProcess) {
            Write-Output "Ngrok process not found. Output: $(Get-Content $outputFile -ErrorAction SilentlyContinue)"
            Write-Output "Errors: $(Get-Content $errorFile -ErrorAction SilentlyContinue)"
            exit 1
          }
          
          Write-Output "Ngrok is running (PID: $($ngrokProcess.Id))"
          
          # Retry API call
          $maxRetries = 10
          $retryCount = 0
          $tunnels = $null
          
          while ($retryCount -lt $maxRetries) {
            try {
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              break
            } catch {
              $retryCount++
              Write-Output "Retry $retryCount/$maxRetries..."
              Start-Sleep -Seconds 5
            }
          }
          
          if ($tunnels -and $tunnels.tunnels.Count -gt 0) {
            foreach ($tunnel in $tunnels.tunnels) {
              Write-Output "Tunnel URL: $($tunnel.public_url)"
            }
          } else {
            Write-Output "Could not get tunnel URL from API. Ngrok may still be working."
            Write-Output "Check ngrok dashboard: https://dashboard.ngrok.com/tunnels/agents"
          }
          
          # Keep workflow alive
          while ($true) { Start-Sleep -Seconds 60 }
          
