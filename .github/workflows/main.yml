name: Setup RDP with Ngrok

on:
  workflow_dispatch:

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Ngrok
        shell: powershell
        run: |
          choco install ngrok -y --no-progress

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          $securePassword = ConvertTo-SecureString -AsPlainText "P@ssword!" -Force
          Set-LocalUser -Name "runneradmin" -Password $securePassword

      - name: Start Ngrok Tunnel
        shell: powershell
        run: |
          # Start ngrok in background with authtoken
          $ngrokJob = Start-Job -ScriptBlock {
            ngrok tcp 3389 --authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          }
          
          # Wait longer for tunnel to establish
          Start-Sleep -Seconds 20
          
          # Retry API call with error handling
          $maxRetries = 5
          $retryCount = 0
          $tunnels = $null
          
          while ($retryCount -lt $maxRetries -and -not $tunnels) {
            try {
              $tunnels = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              break
            } catch {
              $retryCount++
              Write-Output "Retry $retryCount/$maxRetries..."
              Start-Sleep -Seconds 10
            }
          }
          
          if ($tunnels -and $tunnels.tunnels.Count -gt 0) {
            foreach ($tunnel in $tunnels.tunnels) {
              Write-Output "Tunnel URL: $($tunnel.public_url)"
            }
          } else {
            Write-Output "Could not get tunnel URL, but ngrok is running. Check ngrok dashboard."
          }
          
          # Keep workflow alive
          while ($true) { Start-Sleep -Seconds 60 }
          
